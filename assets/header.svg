<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="45%" stop-color="#101522"/>
      <stop offset="100%" stop-color="#17111b"/>
    </linearGradient>

    <!-- Coral Brand Accent Gradient -->
    <linearGradient id="coralAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7259"/>
      <stop offset="50%" stop-color="#ff6652"/>
      <stop offset="100%" stop-color="#ff937d"/>
    </linearGradient>

    <!-- Glowing Accent -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6652" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff846b" stop-opacity="0"/>
    </linearGradient>

    <!-- Monogram Circle Gradient -->
    <linearGradient id="tgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7259"/>
      <stop offset="100%" stop-color="#d94b38"/>
    </linearGradient>

    <!-- Border Linear Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6652" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ff6652" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Text Shimmer -->
    <linearGradient id="shimmerGrad" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#ff8e7b"/>
      <stop offset="55%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff"/>
      <animate attributeName="x1" from="-100%" to="100%" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="0%" to="200%" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
    </filter>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#ff6652" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .font-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
    }
    .font-mono {
      font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
    }
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 500;
    }
    @keyframes pulseOrb {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.1); }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatReverse {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(6px) rotate(4deg); }
    }
    .orb-pulse {
      animation: pulseOrb 6s ease-in-out infinite;
      transform-origin: 820px 80px;
    }
    .float-shape-1 {
      animation: floatSlow 5s ease-in-out infinite;
    }
    .float-shape-2 {
      animation: floatReverse 6s ease-in-out infinite;
    }
  </style>

  <!-- Container Box with Rounded Edges -->
  <rect width="920" height="340" rx="20" fill="url(#bgGrad)"/>
  <rect width="920" height="340" rx="20" fill="url(#dotGrid)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="820" cy="70" r="140" fill="#ff6652" filter="url(#softGlow)" class="orb-pulse"/>
  <circle cx="90" cy="280" r="110" fill="#ff7259" filter="url(#softGlow)" opacity="0.25"/>

  <!-- Border Highlight -->
  <rect x="1" y="1" width="918" height="338" rx="19" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Floating Geometric / Tech Decors -->
  <g class="float-shape-1">
    <!-- Code Brackets Icon Background -->
    <rect x="745" y="80" width="125" height="125" rx="16" fill="#131926" stroke="#252d3d" stroke-width="1.5" opacity="0.75"/>
    <!-- Code symbols -->
    <path d="M 780 135 L 765 145 L 780 155" fill="none" stroke="#ff7259" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 835 135 L 850 145 L 835 155" fill="none" stroke="#ff7259" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 813 130 L 801 160" fill="none" stroke="#8c97aa" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Secondary Floating Card (Figma/Design diamond node) -->
  <g class="float-shape-2">
    <rect x="805" y="215" width="70" height="70" rx="14" fill="#181d28" stroke="#ff6652" stroke-width="1.2" stroke-opacity="0.4" opacity="0.85"/>
    <polygon points="840,232 858,250 840,268 822,250" fill="none" stroke="#ff846b" stroke-width="2.2"/>
    <circle cx="840" cy="250" r="3.5" fill="#ff846b"/>
  </g>

  <!-- Header Top Pill: Welcome Tag -->
  <g transform="translate(50, 42)">
    <rect x="0" y="0" width="225" height="28" rx="14" fill="#1f2533" stroke="#2d3748" stroke-width="1"/>
    <circle cx="16" cy="14" r="5" fill="#ff6652">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="18" fill="#e2e8f0" font-size="12" class="font-mono" letter-spacing="1.5">WELCOME TO MY PROFILE</text>
  </g>

  <!-- Monogram / Avatar Emblem -->
  <g transform="translate(50, 90)">
    <circle cx="45" cy="45" r="44" fill="url(#tgGrad)" filter="url(#badgeGlow)"/>
    <circle cx="45" cy="45" r="41" fill="#0d111a"/>
    <circle cx="45" cy="45" r="36" fill="url(#tgGrad)" opacity="0.15"/>
    <text x="45" y="55" fill="#ffffff" font-size="28" font-weight="900" text-anchor="middle" class="font-title" letter-spacing="2">TG</text>
  </g>

  <!-- Name & Salutation -->
  <g transform="translate(160, 112)">
    <text x="0" y="0" fill="#a0aec0" font-size="18" class="font-sans" letter-spacing="1">Hi there 👋 I'm</text>
    <text x="0" y="44" fill="url(#shimmerGrad)" font-size="44" class="font-title" letter-spacing="-0.5">Thevinu Gunawardena</text>
  </g>

  <!-- Professional Title / Disciplines -->
  <g transform="translate(50, 205)">
    <text x="0" y="0" fill="#ff7259" font-size="19" font-weight="700" class="font-sans" letter-spacing="0.5">
      UI/UX Designer  <tspan fill="#4a5568">|</tspan>  Full-Stack Developer  <tspan fill="#4a5568">|</tspan>  DevOps Enthusiast
    </text>
    <text x="0" y="27" fill="#718096" font-size="15" font-style="italic" class="font-sans">
      “Endlessly Creating from Within”
    </text>
  </g>

  <!-- Skill / Domain Pills -->
  <g transform="translate(50, 268)">
    <!-- Pill 1: UI/UX -->
    <g transform="translate(0, 0)">
      <rect width="148" height="34" rx="8" fill="#151b27" stroke="#263143" stroke-width="1.2"/>
      <circle cx="16" cy="17" r="4" fill="#ff6652"/>
      <text x="28" y="22" fill="#cbd5e1" font-size="13" class="font-sans" font-weight="600">UI/UX &amp; Design</text>
    </g>

    <!-- Pill 2: Web & Mobile -->
    <g transform="translate(160, 0)">
      <rect width="186" height="34" rx="8" fill="#151b27" stroke="#263143" stroke-width="1.2"/>
      <circle cx="16" cy="17" r="4" fill="#ff7259"/>
      <text x="28" y="22" fill="#cbd5e1" font-size="13" class="font-sans" font-weight="600">Web &amp; Mobile Apps</text>
    </g>

    <!-- Pill 3: DevOps -->
    <g transform="translate(358, 0)">
      <rect width="170" height="34" rx="8" fill="#151b27" stroke="#263143" stroke-width="1.2"/>
      <circle cx="16" cy="17" r="4" fill="#ff8f7d"/>
      <text x="28" y="22" fill="#cbd5e1" font-size="13" class="font-sans" font-weight="600">DevOps &amp; Cloud</text>
    </g>

    <!-- Pill 4: Location -->
    <g transform="translate(540, 0)">
      <rect width="150" height="34" rx="8" fill="#151b27" stroke="#263143" stroke-width="1.2"/>
      <text x="16" y="22" font-size="14">🇱🇰</text>
      <text x="40" y="22" fill="#cbd5e1" font-size="13" class="font-sans" font-weight="600">Sri Lanka</text>
    </g>
  </g>
</svg>
